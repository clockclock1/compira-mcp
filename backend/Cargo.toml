[package]
name = "compira-mcp"
version = "0.1.0"
edition = "2021"
description = "Remote frontend component library MCP service"
license = "Apache-2.0"
repository = "https://github.com/clockclock1/compira-mcp"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["macros", "multipart"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
rand = "0.8"
regex = "1.11"
rmcp = { version = "3.1", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
] }
rusqlite = { version = "0.33", features = ["bundled", "chrono"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
