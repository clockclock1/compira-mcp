name: Docker Image

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/compira-mcp

jobs:
  build-linux:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            target: x86_64-unknown-linux-gnu
            artifact: compira-mcp-linux-amd64
          - name: linux-arm64
            target: aarch64-unknown-linux-gnu
            artifact: compira-mcp-linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build Admin UI
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: docker-${{ matrix.target }}

      - name: Install Linux arm64 linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build executable
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --locked --target "${{ matrix.target }}"
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/compira-mcp" "../dist/${{ matrix.artifact }}"
          chmod +x "../dist/${{ matrix.artifact }}"
          # Only amd64 job uploads the arch-independent Admin UI static assets
          if [[ "${{ matrix.name }}" == "linux-amd64" ]]; then
            cp -r ../frontend/dist ../dist/static
          fi

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

      - name: Upload Admin UI static
        if: matrix.name == 'linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: docker-static
          path: dist/static
          if-no-files-found: error

  docker:
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux executables
        uses: actions/download-artifact@v4
        with:
          pattern: docker-linux-*
          path: dist
          merge-multiple: true

      - name: Download Admin UI static
        uses: actions/download-artifact@v4
        with:
          name: docker-static
          path: dist/static

      - name: Prepare executables
        run: |
          chmod +x dist/compira-mcp-linux-amd64 dist/compira-mcp-linux-arm64
          test -f dist/static/index.html
          ls -lhR dist

      - name: Set up QEMU with Docker Hub retry
        shell: bash
        run: |
          image="docker.io/tonistiigi/binfmt:latest"
          for attempt in 1 2 3 4; do
            if docker pull "$image"; then
              docker run --privileged --rm "$image" --install arm64
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              echo "QEMU image pull failed (attempt $attempt/4); retrying in $((attempt * 15)) seconds..."
              sleep $((attempt * 15))
            fi
          done
          echo "Unable to pull $image after 4 attempts." >&2
          exit 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
